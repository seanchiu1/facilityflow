name: FacilityFlow Email Cron

on:
  schedule:
    # Runs daily at 8:00 AM Taiwan time = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send-notification-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        run: |
          curl -i -X POST "https://kwelwlnsxmgazhfzpeqo.supabase.co/functions/v1/send-notification-emails" \
            -H "Authorization: Bearer ${{ secrets.FACILITYFLOW_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "apikey: ${{ secrets.FACILITYFLOW_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "x-notification-secret: ${{ secrets.FACILITYFLOW_NOTIFICATION_FUNCTION_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}'